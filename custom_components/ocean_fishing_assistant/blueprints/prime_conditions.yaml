blueprint:
  name: Prime Fishing Conditions
  description: >
    Send a notification when the fishing score is high AND there are no
    active safety breaches. Optionally requires a species profile to be
    active. Only fires on the rising edge (score crosses from below to
    above threshold).
  domain: automation
  input:
    sensor:
      name: Fishing score sensor
      description: The Ocean Fishing Assistant sensor entity to monitor
      selector:
        entity:
          domain: sensor
    threshold:
      name: Score threshold
      description: Minimum score to trigger (0-100)
      default: 75
      selector:
        number:
          min: 0.0
          max: 100.0
          step: 5.0
          mode: slider
    notify_target:
      name: Notification target
      description: "Notify service, e.g. notify.mobile_app_iphone"
      selector:
        text:
    require_species_match:
      name: Require species profile
      description: Only notify if a specific species profile is selected
      default: true
      selector:
        boolean:
    title:
      name: Notification title
      description: Title of the notification
      default: "Prime Fishing Conditions!"
      selector:
        text:
    quiet_hours_start:
      name: Quiet hours start (optional)
      description: "Only notify after this time, e.g. 07:00. Leave empty to disable."
      default: ""
      selector:
        time:
    quiet_hours_end:
      name: Quiet hours end (optional)
      description: "Only notify before this time, e.g. 21:00. Leave empty to disable."
      default: ""
      selector:
        time:

trigger:
  - platform: numeric_state
    entity_id: !input sensor
    above: !input threshold

condition:
  # Rising-edge: only fire if previous state was below threshold
  - condition: template
    value_template: "{{ trigger.from_state.state | float(-1) < threshold }}"
  # Sensor available
  - condition: template
    value_template: "{{ not is_state(sensor, 'unavailable') }}"
  # No active safety breaches
  - condition: template
    value_template: >
      {% set forecast = state_attr(sensor, 'current_forecast') | default({}) %}
      {% set breaches = forecast.get('breaches', []) %}
      {{ breaches | length == 0 }}
  # Optional: species profile must be active
  - condition: template
    value_template: >
      {% if require_species_match | default(true) %}
        {{ state_attr(sensor, 'profile_used') is not none }}
      {% else %}
        true
      {% endif %}
  # Quiet hours
  - condition: template
    value_template: >
      {% set start = quiet_hours_start | default('') %}
      {% set end = quiet_hours_end | default('') %}
      {% if start == '' or end == '' %}
        true
      {% else %}
        {% set h = now().hour %}
        {{ h >= start.split(':')[0] | int and h <= end.split(':')[0] | int }}
      {% endif %}

action:
  - variables:
      sensor_id: !input sensor
  - service: !input notify_target
    data:
      title: !input title
      message: |-
        {%- set forecast = state_attr(sensor_id, 'current_forecast') | default({}) -%}
        {%- set components = forecast.get('components', {}) -%}
        {%- set profile = state_attr(sensor_id, 'profile_used') | default(none) -%}
        {%- set score = states(sensor_id) | default('?') -%}

        Score: {{ score }}/100 — all clear, no warnings

        {% for factor, data in components | dictsort -%}
          {%- set fs = data.get('score_100', '?') -%}
          {%- if fs >= 70 %}✅ {{ factor }}: {{ fs }}
          {%- elif fs >= 50 %}⚠️ {{ factor }}: {{ fs }}
          {%- else %}❌ {{ factor }}: {{ fs }}
          {%- endif -%}
        {% endfor %}

        Species: {{ profile.common_name | default('General profile') }}

mode: single
