blueprint:
  name: Daily Fishing Briefing
  description: >
    Send a morning briefing with today's fishing forecast periods,
    moon phase, and species profile. Optionally includes tomorrow's
    best period.
  domain: automation
  input:
    sensor:
      name: Fishing score sensor
      description: The Ocean Fishing Assistant sensor entity to read
      selector:
        entity:
          domain: sensor
    trigger_time:
      name: Send time
      description: Time of day to send the briefing
      default: "06:00"
      selector:
        time:
    notify_device:
      name: Notification device
      description: Mobile device to send the notification to
      selector:
        device:
          integration: mobile_app
    include_tomorrow:
      name: Include tomorrow
      description: Include tomorrow's best forecast in the briefing
      default: false
      selector:
        boolean:

trigger:
  - platform: time
    at: !input trigger_time

condition:
  - condition: template
    value_template: "{{ not is_state(sensor, 'unavailable') }}"
  - condition: template
    value_template: >
      {% set periods = state_attr(sensor, 'remainder_of_today_periods') | default({}) %}
      {{ periods.keys() | length > 0 }}

action:
  - variables:
      sensor_id: !input sensor
  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: "Today's Fishing Forecast"
    message: |-
        {%- set periods = state_attr(sensor_id, 'remainder_of_today_periods') | default({}) -%}
        {%- set profile = state_attr(sensor_id, 'profile_used') | default(none) -%}
        {%- set moon = state_attr(sensor_id, 'moon_phase_name') | default('Unknown') -%}
        {%- set tomorrow = state_attr(sensor_id, 'next_5_day_periods') | default({}) -%}

        {% for key, data in periods | dictsort -%}
          {%- set label = (key | replace('period_', '') | replace('_', '-')) + 'h' -%}
          {%- set s = data.score_100 | default(0) -%}
          {%- if s >= 70 %}{{ label }}: {{ s }} — Excellent!
          {%- elif s >= 50 %}{{ label }}: {{ s }} — Good
          {%- else %}{{ label }}: {{ s }} — Fair
          {%- endif -%}
        {% endfor %}

        Moon: {{ moon }}
        Species: {{ profile.common_name | default('General profile') }}
        {%- if include_tomorrow | default(false) and tomorrow.keys() | length > 0 %}
          {%- set today = now().date() -%}
          {%- set tomorrow_key = (today + timedelta(days=1)).isoformat() -%}
          {%- set t_periods = tomorrow.get(tomorrow_key, {}) -%}
          {%- if t_periods.keys() | length > 0 -%}
            {%- set t_all = t_periods.values() | list -%}
            {%- set t_sorted = t_all | sort(attribute='score_100', reverse=true) -%}
            {%- set t_best = t_sorted[0] -%}
            {%- set t_score = t_best.get('score_100', '?') -%}
        Tomorrow best: {{ t_score }}/100
          {%- endif -%}
        {%- endif -%}
  - service: persistent_notification.create
    data:
      title: "Today's Fishing Forecast"
      notification_id: daily_fishing_briefing
      message: |-
        {%- set periods = state_attr(sensor_id, 'remainder_of_today_periods') | default({}) -%}
        {%- set profile = state_attr(sensor_id, 'profile_used') | default(none) -%}
        {%- set moon = state_attr(sensor_id, 'moon_phase_name') | default('Unknown') -%}
        {%- set tomorrow = state_attr(sensor_id, 'next_5_day_periods') | default({}) -%}

        {% for key, data in periods | dictsort -%}
          {%- set label = (key | replace('period_', '') | replace('_', '-')) + 'h' -%}
          {%- set s = data.score_100 | default(0) -%}
          {%- if s >= 70 %}{{ label }}: {{ s }} — Excellent!
          {%- elif s >= 50 %}{{ label }}: {{ s }} — Good
          {%- else %}{{ label }}: {{ s }} — Fair
          {%- endif -%}
        {% endfor %}

        Moon: {{ moon }}
        Species: {{ profile.common_name | default('General profile') }}
        {%- if include_tomorrow | default(false) and tomorrow.keys() | length > 0 %}
          {%- set today = now().date() -%}
          {%- set tomorrow_key = (today + timedelta(days=1)).isoformat() -%}
          {%- set t_periods = tomorrow.get(tomorrow_key, {}) -%}
          {%- if t_periods.keys() | length > 0 -%}
            {%- set t_all = t_periods.values() | list -%}
            {%- set t_sorted = t_all | sort(attribute='score_100', reverse=true) -%}
            {%- set t_best = t_sorted[0] -%}
            {%- set t_score = t_best.get('score_100', '?') -%}
        Tomorrow best: {{ t_score }}/100
          {%- endif -%}
        {%- endif -%}

mode: single
