# Ocean Fishing Assistant — Lovelace Dashboard Example

This dashboard template shows the fishing score, current conditions, tide graph, and 5-day forecast.

## Prerequisites

Install [apexcharts-card](https://github.com/RomRider/apexcharts-card) via HACS for the tide graph.

## Dashboard YAML

Add this to your Lovelace dashboard as a manual card or include via `resources` and `views`:

```yaml
# ---------------------------------------------------------------------------
# Example Lovelace Dashboard for Ocean Fishing Assistant
# Requires: apexcharts-card (install via HACS)
# ---------------------------------------------------------------------------
# Replace |ENTITY| with your sensor entity ID, e.g.:
#   sensor.ocean_fishing_assistant_0123456789abcdef_score
# ---------------------------------------------------------------------------
title: Fishing Conditions
path: fishing
icon: mdi:fish
badges: []
cards:

  # --- Score gauge ---
  - type: gauge
    entity: sensor.|ENTITY|
    name: Fishing Score
    unit: "/100"
    severity:
      green: 70
      yellow: 50
      red: 0
    min: 0
    max: 100

  # --- Current conditions ---
  - type: entities
    title: Current Conditions
    entities:
      - entity: sensor.|ENTITY|
        name: Fishing Score
        type: attribute
        attribute: current_forecast.score_100
      - entity: sensor.|ENTITY|
        name: Tide Phase
        type: attribute
        attribute: current_forecast.tide_phase
      - entity: sensor.|ENTITY|
        name: Wind Speed
        type: attribute
        attribute: current_wind_speed
      - entity: sensor.|ENTITY|
        name: Wind Gust
        type: attribute
        attribute: current_wind_gust
      - entity: sensor.|ENTITY|
        name: Wave Height
        type: attribute
        attribute: current_wave_height
      - entity: sensor.|ENTITY|
        name: Swell Period
        type: attribute
        attribute: current_swell_period_s
      - entity: sensor.|ENTITY|
        name: Temperature
        type: attribute
        attribute: current_temperature
      - entity: sensor.|ENTITY|
        name: Pressure
        type: attribute
        attribute: current_pressure
      - entity: sensor.|ENTITY|
        name: Moon Phase
        type: attribute
        attribute: moon_phase_name
      - entity: sensor.|ENTITY|
        name: Next High Tide
        type: attribute
        attribute: next_high_tide.timestamp
      - entity: sensor.|ENTITY|
        name: Next Low Tide
        type: attribute
        attribute: next_low_tide.timestamp
      - entity: sensor.|ENTITY|
        name: Species Profile
        type: attribute
        attribute: profile_used.common_name

  # --- Tide graph ---
  # Requires apexcharts-card from HACS
  # This creates a visual tide chart for the next 48 hours using
  # tide phase data from the per_timestamp_forecasts.
  # Note: raw data exposure must be enabled in config options for this to work.
  - type: custom:apexcharts-card
    graph_span: 48h
    span:
      start: hour
    header:
      title: Tide & Score (48h)
      show: true
    series:
      - entity: sensor.|ENTITY|
        name: Tide
        attribute: per_timestamp_forecasts
        data_generator: >
          return entity.attributes.per_timestamp_forecasts.map((e, i) => {
            const phase = e.tide_phase;
            const val = phase === 'rising' ? 75 : phase === 'falling' ? 25 : phase === 'high' ? 100 : phase === 'low' ? 0 : 50;
            return [new Date(e.timestamp).getTime(), val];
          });
        type: area
        color: "#2196F3"
        opacity: 0.3
        stroke_width: 1
        show:
          legend_value: false
      - entity: sensor.|ENTITY|
        name: "Score"
        attribute: per_timestamp_forecasts
        data_generator: >
          return entity.attributes.per_timestamp_forecasts.map((e, i) => {
            return [new Date(e.timestamp).getTime(), e.score_100 || 0];
          });
        type: column
        color: "#4CAF50"
        opacity: 0.6
        show:
          legend_value: false
      - entity: sensor.|ENTITY|
        name: "Threshold (70)"
        data_generator: >
          return Array.from({length: 48}, (_, i) => {
            return [new Date(Date.now() + i * 3600000).getTime(), 70];
          });
        type: line
        color: "#FF9800"
        stroke_width: 1
        stroke_dash: 5
        show:
          legend_value: false

  # --- 5-day forecast ---
  - type: entities
    title: 5-Day Forecast
    entities:
      - entity: sensor.|ENTITY|
        name: Today
        type: attribute
        attribute: remainder_of_today_periods
  - type: entities
    title: Next 5 Days
    entities:
      - entity: sensor.|ENTITY|
        name: Day +1
        type: attribute
        attribute: next_5_day_periods
```

## Minimal Starting Dashboard

If you want the fastest path to a working dashboard:

```yaml
title: Fishing
path: fishing
icon: mdi:fish
cards:
  - type: gauge
    entity: sensor.|ENTITY|
    name: Score
    severity:
      green: 70
      yellow: 50
      red: 0
    min: 0
    max: 100

  - type: entities
    title: Now
    entities:
      - entity: sensor.|ENTITY|
        type: attribute
        attribute: current_forecast.components.tide.tide_phase
        name: Tide
      - entity: sensor.|ENTITY|
        type: attribute
        attribute: current_wind_speed
        name: Wind
      - entity: sensor.|ENTITY|
        type: attribute
        attribute: current_wave_height
        name: Waves
      - entity: sensor.|ENTITY|
        type: attribute
        attribute: moon_phase_name
        name: Moon
```

## Automations

### Notify when conditions are excellent

```yaml
alias: "Fishing Alert — Excellent Conditions"
triggers:
  - trigger: state
    entity_id: sensor.|ENTITY|
condition:
  - condition: numeric_state
    entity_id: sensor.|ENTITY|
    above: 70
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: "🎣 Great fishing conditions!"
      message: "Score is {{ states('sensor.|ENTITY|') }}/100. Check the forecast!"
```

### Notify when conditions improve to fair

```yaml
alias: "Fishing Alert — Conditions Improving"
triggers:
  - trigger: numeric_state
    entity_id: sensor.|ENTITY|
    above: 50
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: "Fishing conditions improving"
      message: "Score is now {{ states('sensor.|ENTITY|') }}/100"
```
